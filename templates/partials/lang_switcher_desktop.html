{# Desktop language dropdown: include inside a .desktop-icons container #}
<style>
  .lang-dropdown { position: relative; }
  .lang-button { position: relative; }
  .lang-menu {
    position: absolute;
    top: 110%;
    right: 0;
    min-width: 180px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid var(--border, rgba(212,165,116,0.2));
    border-radius: 0.75rem;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    padding: 0.5rem;
    display: none;
    z-index: 1200;
    backdrop-filter: blur(12px);
  }
  .lang-dropdown.open .lang-menu { display: block; }
  .lang-item {
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 0.55rem 0.75rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--foreground, #333);
  }
  .lang-item:hover { background: var(--secondary, #f7f3ed); }
</style>
<div class="lang-dropdown" id="lang-dropdown">
  <button class="icon-button lang-button" id="lang-button" aria-haspopup="true" aria-expanded="false" title="Change language">
    <i class="fas fa-globe"></i>
  </button>
  <div class="lang-menu" id="lang-menu" role="menu">
    <button type="button" class="lang-item" data-lang="en">English</button>
    <button type="button" class="lang-item" data-lang="ar">العربية</button>
    <button type="button" class="lang-item" data-lang="cs">Čeština</button>
    <button type="button" class="lang-item" data-lang="pl">Polski</button>
  </div>
</div>
