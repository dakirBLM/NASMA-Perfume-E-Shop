{# Mobile language buttons: include inside the <nav class="mobile-nav"> #}
<div class="mobile-lang" style="margin-top: 1rem; text-align: center;">
  <span class="mobile-lang-label" style="display:block;font-family:'Inter',sans-serif;font-size:0.9rem;color:var(--muted-foreground,#8b7355);margin-bottom:0.5rem;">Language</span>
  <div class="mobile-lang-buttons" style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;">
    <button type="button" class="mobile-lang-btn" data-lang="en" style="border:1px solid var(--border,rgba(212,165,116,0.2));background:var(--secondary,#f7f3ed);color:var(--foreground,#333);padding:0.4rem 0.75rem;border-radius:999px;font-family:'Inter',sans-serif;font-size:0.85rem;cursor:pointer;">EN</button>
    <button type="button" class="mobile-lang-btn" data-lang="ar" style="border:1px solid var(--border,rgba(212,165,116,0.2));background:var(--secondary,#f7f3ed);color:var(--foreground,#333);padding:0.4rem 0.75rem;border-radius:999px;font-family:'Inter',sans-serif;font-size:0.85rem;cursor:pointer;">AR</button>
    <button type="button" class="mobile-lang-btn" data-lang="cs" style="border:1px solid var(--border,rgba(212,165,116,0.2));background:var(--secondary,#f7f3ed);color:var(--foreground,#333);padding:0.4rem 0.75rem;border-radius:999px;font-family:'Inter',sans-serif;font-size:0.85rem;cursor:pointer;">CS</button>
    <button type="button" class="mobile-lang-btn" data-lang="pl" style="border:1px solid var(--border,rgba(212,165,116,0.2));background:var(--secondary,#f7f3ed);color:var(--foreground,#333);padding:0.4rem 0.75rem;border-radius:999px;font-family:'Inter',sans-serif;font-size:0.85rem;cursor:pointer;">PL</button>
  </div>
</div>
